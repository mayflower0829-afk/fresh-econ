<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16A34A">
  <meta name="description" content="生鲜账 · 农产品电商单位经济计算器：损耗、包装、冷链、佣金、包赔层层扒皮后，一单到底赚不赚钱？保本定价、保本单量、敏感性分析，输入即算。">
  <title>生鲜账 · 农产品电商单位经济计算器</title>
  <meta property="og:title" content="生鲜账 · 农产品电商单位经济计算器">
  <meta property="og:description" content="卖一单水果到底赚不赚钱？损耗、包装、冷链、佣金、包赔全算清：保本定价、保本单量、敏感性分析。源自三创赛国家级一等奖生鲜电商项目的真实口径。">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2316A34A'/><text x='50' y='68' font-size='44' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>¥</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header id="appHeader">
  <div class="brand">
    <h1>生鲜账 <span class="en">Fresh Unit Economics</span></h1>
    <span class="sub">农产品电商单位经济计算器 · 源自三创赛国家级一等奖生鲜电商项目</span>
  </div>
</header>

<main>
  <div class="preset-row">
    <span>预设方案：</span>
    <button class="preset" data-preset="tubo">土拨购乡橙（5斤装99元）</button>
    <button class="preset" data-preset="generic">通用生鲜（客单50元）</button>
    <button class="preset" data-preset="custom">自定义</button>
  </div>

  <div class="layout">
    <div class="card inputs">
      <div class="card-title">① 销售与采购</div>
      <div class="f"><label>客单价（元/单）</label><input type="number" id="price" value="99" step="0.1"></div>
      <div class="f"><label>每单重量（斤）</label><input type="number" id="weight" value="5" step="0.5"></div>
      <div class="f"><label>产地采购价（元/斤）</label><input type="number" id="cost" value="3.2" step="0.1"></div>
      <div class="f"><label>采后损耗率（%）</label><input type="number" id="loss" value="8" step="0.5"></div>

      <div class="card-title" style="margin-top:14px">② 履约成本（元/单）</div>
      <div class="f"><label>包装材料</label><input type="number" id="pack" value="4.5" step="0.5"></div>
      <div class="f"><label>快递/冷链</label><input type="number" id="ship" value="8" step="0.5"></div>
      <div class="f"><label>售后包赔计提（%）</label><input type="number" id="comp" value="3" step="0.5"></div>

      <div class="card-title" style="margin-top:14px">③ 平台与获客</div>
      <div class="f"><label>平台佣金/支付费率（%）</label><input type="number" id="fee" value="2" step="0.5"></div>
      <div class="f"><label>推广费（元/单）</label><input type="number" id="ads" value="6" step="0.5"></div>
      <div class="f"><label>固定成本（元/月：人力、仓储等）</label><input type="number" id="fixed" value="6000" step="500"></div>
      <div class="f"><label>日均订单量（单/天）</label><input type="number" id="orders" value="30" step="1"></div>
    </div>

    <div class="col">
      <div class="card results">
        <div class="card-title">一单的账（按可达果重口径）</div>
        <div id="waterfall" class="chart" style="height:280px"></div>
        <div id="unitRows"></div>
      </div>
      <div class="card">
        <div class="card-title">保本点</div>
        <div id="breakeven"></div>
      </div>
      <div class="card">
        <div class="card-title">敏感性：月利润对哪个参数最敏感</div>
        <div id="tornado" class="chart" style="height:260px"></div>
        <p class="hint">对损耗率、快递费、客单价、推广费各做 ±10% 扰动，观察月利润变化幅度（龙卷风图）——它告诉你下一笔钱该花在哪。</p>
      </div>
      <div class="card">
        <div class="card-title">经营提示</div>
        <div class="hint" id="advice"></div>
      </div>
    </div>
  </div>

  <footer style="text-align:center;font-size:12px;padding:10px 0 30px;">
    <a href="/" style="color:var(--accent);text-decoration:none;">← 返回作品集主页</a>
     · 计算口径与局限见 <a href="https://github.com/mayflower0829-afk/fresh-econ" target="_blank" rel="noopener">项目仓库</a>
  </footer>
</main>

<div id="toast" role="status"></div>

<script src="echarts.min.js"></script>
<script src="app.js"></script>
</body>
</html>
